      - rskj-data-miner2:/var/lib/rsk
      - ./rsk/genesis_17M.json:/var/lib/rsk/genesis.json
    labels:
      simulation.id: "rskj-miner2"
    restart: unless-stopped
    deploy:
      resources:
        limits:
