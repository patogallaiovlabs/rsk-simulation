name: rsk-nodes

services:
  rskj-miner1:
    platform: linux/arm64
    build:
      context: .
      dockerfile: rsk/Dockerfile
    container_name: rskj-miner1
    networks:
      - rsk-simulation-net
    environment:
      - MINER_ID=1
      - IS_MINER=true
      - ENABLE_JMX=true
      - JMX_PORT=9101
      - JMX_HOSTNAME=127.0.0.1
      - WIRE_DELAY=0
      - BLOCK_GAS_LIMIT=25000000
      - GENESIS_FILE=/var/lib/rsk/genesis.json
      - SHARED_BLOCK_CACHE_SIZE=1M
      - FLUSH_BLOCKS=${FLUSH_BLOCKS:-10}
      - MALLOC_CONF=dirty_decay_ms:5000,muzzy_decay_ms:5000,tcache:true,background_thread:true,narenas:4
      - DEFAULT_JVM_OPTS=-Xms3G -Xmx3G -XX:MaxDirectMemorySize=512M -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:NativeMemoryTracking=summary
      # miner1 only: LZ4-compress the receipts RocksDB (per-DB override of rsk.conf via -D system prop)
      - RSKJ_SYS_PROPS=-Drsk.conf.file=/var/lib/rsk/rsk.conf -Dlogging.dir=test/local-regtest/ -Ddatabase.rocksdb.compressionType.receipts=lz4
      - RSKJ_LOG_PROPS=-Dlogback.configurationFile=/var/lib/rsk/logback.xml -Dlogging.stdout=INFO -Dlogging.file=INFO -Dlogging=INFO
    ports:
      - "50501:50501"
      - "4444:4444"
      - "4445:4445"
      - "9101:9101"
      - "9501:8080"
    volumes:
      - rskj-data-miner1:/var/lib/rsk
      - ./rsk/genesis/genesis_25M.json:/var/lib/rsk/genesis.json
      - ./rsk/rsk.conf:/var/lib/rsk/rsk.conf
      - ./rsk/logback.xml:/var/lib/rsk/logback.xml
    labels:
      simulation.id: "rskj-miner1"
    restart: no
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 5G

  rskj-miner2:
    platform: linux/arm64
    build:
      context: .
      dockerfile: rsk/Dockerfile
    container_name: rskj-miner2
    networks:
      - rsk-simulation-net
    environment:
      - MINER_ID=2
      - IS_MINER=true
      - ENABLE_JMX=true
      - JMX_PORT=9102
      - JMX_HOSTNAME=127.0.0.1
      - WIRE_DELAY=0
      - BLOCK_GAS_LIMIT=25000000
      - GENESIS_FILE=/var/lib/rsk/genesis.json
      # Matches miner4: no shared block cache, no compression override, jemalloc disabled
      - ENABLE_JEMALLOC=false
      - FLUSH_BLOCKS=${FLUSH_BLOCKS:-10}
      - MALLOC_CONF=dirty_decay_ms:5000,muzzy_decay_ms:5000,tcache:true,background_thread:true,narenas:4
      - DEFAULT_JVM_OPTS=-Xms3G -Xmx3G -XX:MaxDirectMemorySize=512M -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:NativeMemoryTracking=summary
      - RSKJ_SYS_PROPS=-Drsk.conf.file=/var/lib/rsk/rsk.conf -Dlogging.dir=test/local-regtest/
      - RSKJ_LOG_PROPS=-Dlogback.configurationFile=/var/lib/rsk/logback.xml -Dlogging.stdout=INFO -Dlogging.file=INFO -Dlogging=INFO
    ports:
      - "50502:50502"
      - "4446:4444"
      - "4447:4445"
      - "9102:9102"
      - "9502:8080"
    volumes:
      - rskj-data-miner2:/var/lib/rsk
      - ./rsk/genesis/genesis_25M.json:/var/lib/rsk/genesis.json
      - ./rsk/rsk.conf:/var/lib/rsk/rsk.conf
      - ./rsk/logback.xml:/var/lib/rsk/logback.xml
    labels:
      simulation.id: "rskj-miner2"
    restart: no
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 5G

  rskj-miner3:
    platform: linux/arm64
    build:
      context: .
      dockerfile: rsk/Dockerfile
    container_name: rskj-miner3
    networks:
      - rsk-simulation-net
    environment:
      - MINER_ID=3
      - IS_MINER=true
      - ENABLE_JMX=true
      - JMX_PORT=9103
      - JMX_HOSTNAME=127.0.0.1
      - WIRE_DELAY=0
      - BLOCK_GAS_LIMIT=25000000
      - GENESIS_FILE=/var/lib/rsk/genesis.json
      - SHARED_BLOCK_CACHE_SIZE=1G
      - FLUSH_BLOCKS=${FLUSH_BLOCKS:-10}
      - MALLOC_CONF=dirty_decay_ms:5000,muzzy_decay_ms:5000,tcache:true,background_thread:true,narenas:4
      - DEFAULT_JVM_OPTS=-Xms3G -Xmx3G -XX:MaxDirectMemorySize=512M -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:NativeMemoryTracking=summary
      # miner3 only: LZ4-compress ALL RocksDBs (default per-DB compression override of rsk.conf via -D system prop)
      - RSKJ_SYS_PROPS=-Drsk.conf.file=/var/lib/rsk/rsk.conf -Dlogging.dir=test/local-regtest/ -Ddatabase.rocksdb.compressionType.default=lz4
      - RSKJ_LOG_PROPS=-Dlogback.configurationFile=/var/lib/rsk/logback.xml -Dlogging.stdout=INFO -Dlogging.file=INFO -Dlogging=INFO
    ports:
      - "50503:50503"
      - "4448:4444"
      - "4449:4445"
      - "9103:9103"
      - "9503:8080"
    volumes:
      - rskj-data-miner3:/var/lib/rsk
      - ./rsk/genesis/genesis_25M.json:/var/lib/rsk/genesis.json
      - ./rsk/rsk.conf:/var/lib/rsk/rsk.conf
      - ./rsk/logback.xml:/var/lib/rsk/logback.xml
    labels:
      simulation.id: "rskj-miner3"
    restart: no
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 5G

  # Clean baseline miner: no OS/DB tuning (MALLOC_CONF, SHARED_BLOCK_CACHE_SIZE)
  # and no JMX/wire overrides — everything falls back to the image defaults.
  # Only the JVM opts, sys props, and log props are kept.
  rskj-miner4:
    platform: linux/arm64
    build:
      context: .
      dockerfile: rsk/Dockerfile
    container_name: rskj-miner4
    networks:
      - rsk-simulation-net
    environment:
      - MINER_ID=4
      - IS_MINER=true
      - ENABLE_JMX=true
      # Baseline node: use the glibc allocator (no jemalloc preload)
      - ENABLE_JEMALLOC=false
      - BLOCK_GAS_LIMIT=25000000
      - FLUSH_BLOCKS=${FLUSH_BLOCKS:-1000}
      - GENESIS_FILE=/var/lib/rsk/genesis.json
      - DEFAULT_JVM_OPTS=-Xms3G -Xmx3G -XX:MaxDirectMemorySize=512M -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:NativeMemoryTracking=summary
      - RSKJ_SYS_PROPS=-Drsk.conf.file=/var/lib/rsk/rsk.conf -Dlogging.dir=test/local-regtest/
      - RSKJ_LOG_PROPS=-Dlogback.configurationFile=/var/lib/rsk/logback.xml -Dlogging.stdout=INFO -Dlogging.file=INFO -Dlogging=INFO
    ports:
      - "50504:50504"
      - "4450:4444"
      - "4451:4445"
      - "9504:8080"
    volumes:
      - rskj-data-miner4:/var/lib/rsk
      - ./rsk/genesis/genesis_25M.json:/var/lib/rsk/genesis.json
      - ./rsk/rsk.conf:/var/lib/rsk/rsk.conf
      - ./rsk/logback.xml:/var/lib/rsk/logback.xml
    labels:
      simulation.id: "rskj-miner4"
    restart: no
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 5G

  rskj-node1:
    platform: linux/amd64
    # Disabled: only starts when the "disabled" profile is explicitly enabled
    # (e.g. `docker compose -f docker-compose.rskj.yml --profile disabled up -d`).
    profiles:
      - disabled
    build:
      context: .
      dockerfile: rsk/Dockerfile
    container_name: rskj-node1
    networks:
      - rsk-simulation-net
    environment:
      - MINER_ID=1
      - IS_MINER=false
      - ENABLE_JMX=true
      - JMX_PORT=9201
      - JMX_HOSTNAME=127.0.0.1
      - WIRE_DELAY=0
      - BLOCK_GAS_LIMIT=25000000
      - GENESIS_FILE=/var/lib/rsk/genesis.json
      - SHARED_BLOCK_CACHE_SIZE=1M
      - FLUSH_BLOCKS=${FLUSH_BLOCKS:-100}
      - MALLOC_CONF=dirty_decay_ms:5000,muzzy_decay_ms:5000,tcache:true,background_thread:true,narenas:4
      - DEFAULT_JVM_OPTS=-Xms4G -Xmx4G -XX:MaxDirectMemorySize=512M -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:NativeMemoryTracking=summary
      - RSKJ_SYS_PROPS=-Drsk.conf.file=/var/lib/rsk/rsk.conf -Dlogging.dir=test/local-regtest/
      - RSKJ_LOG_PROPS=-Dlogback.configurationFile=/var/lib/rsk/logback.xml -Dlogging.stdout=INFO -Dlogging.file=INFO -Dlogging=INFO
    ports:
      - "50601:50601"
      - "4464:4444"
      - "4475:4445"
      - "9201:9201"
      - "9505:8080"
    volumes:
      - rskj-data-node1:/var/lib/rsk
      - ./rsk/genesis/genesis_25M.json:/var/lib/rsk/genesis.json
      - ./rsk/rsk.conf:/var/lib/rsk/rsk.conf
      - ./rsk/logback.xml:/var/lib/rsk/logback.xml
    labels:
      simulation.id: "rskj-node1"
    restart: no
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G

  rskj-node2:
    platform: linux/arm64
    # Disabled: only starts when the "disabled" profile is explicitly enabled
    # (e.g. `docker compose -f docker-compose.rskj.yml --profile disabled up -d`).
    profiles:
      - disabled
    build:
      context: .
      dockerfile: rsk/Dockerfile
    container_name: rskj-node2
    networks:
      - rsk-simulation-net
    environment:
      - MINER_ID=2
      - IS_MINER=false
      - ENABLE_JMX=true
      - JMX_PORT=9202
      - JMX_HOSTNAME=127.0.0.1
      - WIRE_DELAY=0
      - BLOCK_GAS_LIMIT=25000000
      - GENESIS_FILE=/var/lib/rsk/genesis.json
      - SHARED_BLOCK_CACHE_SIZE=1M
      - FLUSH_BLOCKS=${FLUSH_BLOCKS:-100}
      - MALLOC_CONF=dirty_decay_ms:5000,muzzy_decay_ms:5000,tcache:true,background_thread:true,narenas:4
      - DEFAULT_JVM_OPTS=-Xms4G -Xmx4G -XX:MaxDirectMemorySize=512M -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:NativeMemoryTracking=summary
      - RSKJ_SYS_PROPS=-Drsk.conf.file=/var/lib/rsk/rsk.conf -Dlogging.dir=test/local-regtest/
      - RSKJ_LOG_PROPS=-Dlogback.configurationFile=/var/lib/rsk/logback.xml -Dlogging.stdout=INFO -Dlogging.file=INFO -Dlogging=INFO
    ports:
      - "50602:50602"
      - "4465:4444"
      - "4476:4445"
      - "9202:9202"
      - "9506:8080"
    volumes:
      - rskj-data-node2:/var/lib/rsk
      - ./rsk/genesis/genesis_25M.json:/var/lib/rsk/genesis.json
      - ./rsk/rsk.conf:/var/lib/rsk/rsk.conf
      - ./rsk/logback.xml:/var/lib/rsk/logback.xml
    labels:
      simulation.id: "rskj-node2"
    restart: no
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G

networks:
  rsk-simulation-net:
    external: true

volumes:
  rskj-data-miner1:
  rskj-data-miner2:
  rskj-data-miner3:
  rskj-data-miner4:
  rskj-data-node1:
  rskj-data-node2:
