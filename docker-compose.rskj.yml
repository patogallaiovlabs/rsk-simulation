name: rsk-nodes

services:
  rskj-miner1:
    build:
      context: .
      dockerfile: rsk/Dockerfile
    container_name: rskj-miner1
    networks:
      - rsk-simulation-net
    environment:
      - MINER_ID=1
      - IS_MINER=true
      - ENABLE_JMX=true
      - JMX_PORT=9101
      - JMX_HOSTNAME=127.0.0.1
      - WIRE_DELAY=500
      - BLOCK_GAS_LIMIT=${BLOCK_GAS_LIMIT:-17000000}
      - GENESIS_FILE=/var/lib/rsk/genesis.json
      - FLUSH_BLOCKS=${FLUSH_BLOCKS:-100}
    ports:
      - "50501:50501"
      - "4444:4444"
      - "4445:4445"
      - "9101:9101"
      - "9501:8080"
    volumes:
      - rskj-data-miner1:/var/lib/rsk
      - ./rsk/genesis_17M.json:/var/lib/rsk/genesis.json
    labels:
      simulation.id: "rskj-miner1"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G

  rskj-miner2:
    build:
      context: .
      dockerfile: rsk/Dockerfile
    container_name: rskj-miner2
