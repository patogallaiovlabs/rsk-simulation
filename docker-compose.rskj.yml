name: rsk-nodes

services:
  rskj-miner1:
    platform: linux/amd64
    build:
      context: .
      dockerfile: rsk/Dockerfile
    container_name: rskj-miner1
    networks:
      - rsk-simulation-net
    environment:
      - MINER_ID=1
      - IS_MINER=true
      - ENABLE_JMX=true
      - JMX_PORT=9101
      - JMX_HOSTNAME=127.0.0.1
      - WIRE_DELAY=0
      - BLOCK_GAS_LIMIT=25000000
      - GENESIS_FILE=/var/lib/rsk/genesis.json
      - FLUSH_BLOCKS=${FLUSH_BLOCKS:-1000}
      - RSKJ_SYS_PROPS=-Drsk.conf.file=./test/node-timedMine.conf -DtxLoad.profile=cpu -DtxLoad.enabled=false -Drpc.providers.web.cors=* -Drpc.providers.web.http.port=4444 -Drpc.providers.web.http.enabled=true -Drpc.providers.web.ws.enabled=true -Drpc.providers.web.ws.port=4445 -Ddatabase.dir=./test/local-regtest/database -Dtransaction.accountSlots=500 -Dtransaction.accountTxRateLimit.enabled=false -Dpeer.messageQueue.thresholdPerMinutePerPeer=100000 -Dminer.server.updateWorkOnNewTransaction=true -Dminer.client.delayBetweenRefreshes=1s -Dlogging.dir=test/local-regtest/ -Dsync.peer.count=20 -Drpc.providers.web.http.bind_address=0.0.0.0
    ports:
      - "50501:50501"
      - "4444:4444"
      - "4445:4445"
      - "9101:9101"
      - "9501:8080"
    volumes:
      - rskj-data-miner1:/var/lib/rsk
      - ./rsk/genesis_25M.json:/var/lib/rsk/genesis.json
    labels:
      simulation.id: "rskj-miner1"
    restart: no
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G

