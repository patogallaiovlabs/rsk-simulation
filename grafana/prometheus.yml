global:
  scrape_interval: 1s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9300"]

  - job_name: "docker-stats-exporter"
    static_configs:
      - targets: ["docker-stats-exporter:9487"]

  - job_name: "promtail"
    static_configs:
      - targets: ["host.docker.internal:9080"]
    # Restore container_id from simulation_id so dashboards and queries keep working
    metric_relabel_configs:
      - source_labels: [simulation_id]
        target_label: container_id
        regex: (.+)
        replacement: $1

  - job_name: "rskj-jvm"
    static_configs:
      - targets: ["rskj-miner1:8080"]
        labels:
          name: "rskj-miner1"
      - targets: ["rskj-miner2:8080"]
        labels:
          name: "rskj-miner2"
      - targets: ["rskj-miner3:8080"]
        labels:
          name: "rskj-miner3"
      - targets: ["rskj-miner4:8080"]
        labels:
          name: "rskj-miner4"
      - targets: ["rskj-node1:8080"]
        labels:
          name: "rskj-node1"
      - targets: ["rskj-node2:8080"]
        labels:
          name: "rskj-node2"
