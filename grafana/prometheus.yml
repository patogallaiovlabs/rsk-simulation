global:
  scrape_interval: 1s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9300"]

  - job_name: "docker-stats-exporter"
    static_configs:
      - targets: ["docker-stats-exporter:9487"]

  - job_name: "promtail"
    static_configs:
      - targets: ["host.docker.internal:9080"]
