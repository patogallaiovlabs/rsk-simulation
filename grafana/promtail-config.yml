server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-json-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # 1. Force job label
      - target_label: job
        replacement: docker-json-logs
      # 2. Ensure at least one label for Loki (avoids "at least one label pair required")
      - target_label: source
        replacement: promtail
      # 3. Extract our custom label 'simulation.id'
      - source_labels: ['__meta_docker_container_label_simulation_id']
        target_label: 'container_id'
      # 4. Only keep containers that have our label
      - source_labels: ['container_id']
        regex: 'rskj-.*'
        action: keep

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream

      # === EVENT 1: block processed ===
      - match:
          selector: '{job="docker-json-logs"} |= "processed after:"'
          stages:
            - output:
                source: log

            # Extract uncles / difficulty / gasUsed / gasLimit / processed_s
            - regex:
                expression: 'uncles:\[(?P<uncles>[^\]]*)\].*difficulty:\[(?P<difficulty>[0-9]+)\].*txs:\[(?P<txs>[0-9]+)\].*gasUsed:\s*(?P<gasUsed>[0-9]+),\s*gasLimit:\s*(?P<gasLimit>[0-9]+),\s*processed after:\s*\[(?P<processed_s>[0-9.]+)\]seconds'

            - template:
                source: uncles
                template: '{{ if .Value }}{{ len (splitList "," .Value) }}{{ else }}0{{ end }}'
                dest: uncle_count
            
            # Export Prometheus metrics
            - metrics:
                block_uncle_count:
                  type: gauge
                  source: uncle_count
                  config:
                    action: set
                block_processed_after_seconds:
                  type: gauge
                  source: processed_s
                  config:
                    action: set
                block_gas_used:
                  type: gauge
                  source: gasUsed
                  config:
                    action: set
                block_gas_limit:
                  type: gauge
                  source: gasLimit
                  config:
                    action: set
                block_difficulty:
                  type: gauge
                  source: difficulty
                  config:
                    action: set
                block_txs:
                  type: gauge
                  source: txs
                  config:
                    action: set

      # === EVENT 2: datasource flush ===
      - match:
          selector: '{job="docker-json-logs"} |= "datasource flush:"'
          stages:
            - output:
                source: log

            - regex:
                expression: 'datasource flush:\s*\[(?P<datasource_flush_s>[0-9.]+)\]seconds'

            - metrics:
                block_datasource_flush_seconds:
                  type: gauge
                  source: datasource_flush_s
                  config:
                    action: set
