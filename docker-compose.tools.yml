name: rsk-tools

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - rsk-simulation-net
    volumes:
      - ./${PROMETHEUS_CONFIG:-grafana/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  rsk-rpc-exporter:
    build:
      context: ./rsk-rpc-exporter
      dockerfile: Dockerfile
    container_name: rsk-rpc-exporter
    networks:
      - rsk-simulation-net
    environment:
      - RPC_URLS=http://rskj-miner1:4444,http://rskj-miner2:4444,http://rskj-miner3:4444,http://rskj-miner4:4444,http://rskj-node1:4444,http://rskj-node2:4444
      - PORT=9090
      - DOCKER_API_VERSION=1.44
    ports:
      - "9092:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - rsk-simulation-net
    ports:
      - "3002:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    networks:
      - rsk-simulation-net
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /var/run:/var/run:ro
      - /run:/run:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    networks:
      - rsk-simulation-net
    ports:
      - "9300:9100"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  docker-stats-exporter:
    image: wywywywy/docker_stats_exporter:latest
    container_name: docker-stats-exporter
    networks:
      - rsk-simulation-net
    ports:
      - "9487:9487"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    networks:
      - rsk-simulation-net
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./grafana/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    networks:
      - rsk-simulation-net
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./grafana/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      - loki

networks:
  rsk-simulation-net:
    external: true

volumes:
  loki_data:
  prometheus_data:
