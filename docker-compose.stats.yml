services:
  stats-backend:
    build:
      context: repos/stats-backend
      dockerfile: ../../stats-backend/Dockerfile
    container_name: stats-backend
    ports:
      - "3001:3000"
    environment:
      - WS_SECRET=eth-net-stats-secret
    restart: unless-stopped

  stats-agent-miner1:
    build:
      context: repos/stats-agent
      dockerfile: ../../stats-agent/Dockerfile
    container_name: stats-agent-miner1
    environment:
      - NODE_ENV=regtest
      - RPC_HOST=rskj-miner1
      - RPC_PORT=4444
      - LISTENING_PORT=50501
      - INSTANCE_NAME=rskj-miner1
      - WS_SERVER=ws://stats-backend:3000
      - WS_SECRET=eth-net-stats-secret
      - VERBOSITY=2
    depends_on:
      - stats-backend
    restart: unless-stopped

