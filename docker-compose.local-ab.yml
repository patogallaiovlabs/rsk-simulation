# Single-miner local A/B. One version per run, one scenario per run, same machine.
#
# Why this exists: comparing two builds on two cloud boxes cannot separate a build
# effect from a box effect -- boxes in different regions measured the same jar 2x apart.
# Running both builds sequentially on ONE machine removes the box term entirely; what
# remains is a time term, which is controllable (back-to-back runs, idle machine) and
# checkable (re-run the first build at the end).
#
#   AB_IMAGE=rskj-local:baseline docker compose -f docker-compose.local-ab.yml up -d
#
# Resources match a Boton box (2 CPU, and the same -Xmx) so the shapes are comparable,
# though absolute numbers are not: this is arm64, Boton is amd64.
services:
  rskj-ab:
    image: ${AB_IMAGE:?set AB_IMAGE to rskj-local:baseline or rskj-local:tip}
    platform: linux/arm64
    container_name: rskj-ab
    environment:
      - MINER_ID=1
      - IS_MINER=true
      - WIRE_DELAY=0
      # Gas limit and genesis must move together; GAS_M is derived from GAS_LIMIT by
      # the caller (scripts/build-seed.sh, scripts/local-ab.sh) so they cannot drift.
      - BLOCK_GAS_LIMIT=${GAS_LIMIT:-25000000}
      - GENESIS_FILE=/var/lib/rsk/genesis/genesis_${GAS_M:-25}M.json
      - FLUSH_BLOCKS=10
      - DEFAULT_JVM_OPTS=-Xms4G -Xmx4G -XX:NativeMemoryTracking=summary
      - RSKJ_SYS_PROPS=-Drsk.conf.file=/var/lib/rsk/rsk.conf -Dlogging.dir=test/local-regtest/ -Dtransaction.accountTxRateLimit.enabled=false
      - RSKJ_LOG_PROPS=-Dlogback.configurationFile=/var/lib/rsk/logback.xml -Dlogging.stdout=OFF -Dlogging.file=INFO -Dlogging=INFO
    ports:
      - "4444:4444"
      - "4445:4445"
    volumes:
      - rskj-data-ab:/var/lib/rsk
      - ./rsk/genesis:/var/lib/rsk/genesis
      - ./rsk/rsk.conf:/var/lib/rsk/rsk.conf
      - ./rsk/logback-lean.xml:/var/lib/rsk/logback.xml
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G
volumes:
  rskj-data-ab:
